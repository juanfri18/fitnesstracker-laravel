version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness_app
    ports:
      - "8000:80"
    volumes:
      # Solo persistimos las fotos de perfil subidas por los usuarios.
      # El código fuente vive en la imagen (COPY en Dockerfile) — no montamos
      # .:/var/www/html para evitar el puente WSL2 lento en Windows.
      - fitness_storage:/var/www/html/storage/app/public
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=error
      - APP_URL=http://localhost:8000
      - APP_KEY=base64:ZdGxVCtE5kIuFNy8pA4oKZV51H/5MFj2MWywma1msHM=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=fitnesstracker
      - DB_USERNAME=sail
      - DB_PASSWORD=password
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: fitness_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=fitnesstracker
      - MYSQL_USER=sail
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - fitness_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fitness_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=sail
      - PMA_PASSWORD=password
    depends_on:
      - db

volumes:
  fitness_db_data:
  fitness_storage:
